    font-size: 15px;
    font-weight: 600;

}

    cursor: not-allowed;
}
.error {

    margin-top: 12px;
    display: none;
}
.spinner {

    height: 16px;

    margin-right: 8px;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.footer {
    margin-top: 24px;
    font-size: 11px;
    color: #555;
}

            // Give the browser a moment to process the form submission for credential save
            form.submit();
            await new Promise(r => setTimeout(r, 500));
        } catch(fe) { /* Form trick failed — continue anyway */ }

        // Replace entire document with decrypted content
        document.open();
        document.write(html);
        document.close();
    } catch (e) {
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'Enter';
        document.getElementById('pwd').select();
    }
}
</script>
</body>
